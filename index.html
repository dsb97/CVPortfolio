<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>CV David</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Varela+Round&display=swap');
    </style>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="ui.css" />

</head>

<body>
    <div id="desktop">
        <!-- Iconos de escritorio -->
        <div class="ui-grid-item desktop-icon" data-app-id="explorer" ondblclick="
        openApp('explorer', {
            path: ['Lenguajes']
        })">
            <div class="icon-image">
                <img src="/assets/icons/languages.png" alt="">
            </div>
            <span class="icon-label">Lenguajes</span>
        </div>
        <div class="ui-grid-item desktop-icon" data-app-id="explorer" ondblclick="
        openApp('explorer', {
            path: ['Frameworks']
        })">
            <div class="icon-image">
                <img src="/assets/icons/frameworks.png" alt="">
            </div>
            <span class="icon-label">Frameworks</span>
        </div>
        <div class="ui-grid-item desktop-icon" data-app-id="explorer" ondblclick="
        openApp('explorer', {
            path: ['Microsoft']
        })">
            <div class="icon-image">
                <img src="/assets/icons/microsoft.png" alt="">
            </div>
            <span class="icon-label">Microsoft</span>
        </div>
        <div class="ui-grid-item desktop-icon" data-app-id="explorer" ondblclick="
            openApp('textEditor', {
                firstLoad: true,
                title: 'Responsabilidades.ted'
            });">
            <div class="icon-image">
                <img src="/assets/icons/document.png" alt="">
            </div>
            <span class="icon-label">Responsabilidades.ted</span>
        </div>
    </div>

    <div id="statusbar">
        <div class="statusbar-left">
            <img id="forecastIcon" height="20" src="" alt="">
            <span><strong id="forecastDescription">Previsión no disponible</strong> - <span id="cityName"></span></span>
        </div>

        <div class="statusbar-center">
            
        </div>

        <div class="statusbar-right">
            <span id="date"></span>
            <span id="hour"></span>
        </div>
    </div>

    <!-- Dock inferior -->
    <div id="dock">
        <div id="dock-icons">
        </div>
    </div>

    <!-- Plantilla oculta de ventana (base para clonar) -->
    <template id="window-template">
        <div class="window" data-window-id="">
            <div class="window-titlebar">
                <div class="window-title">Ventana</div>
                <div class="window-buttons">
                    <button class="btn-minimize"></button>
                    <button class="btn-maximize"></button>
                    <button class="btn-close"></button>
                </div>
            </div>
            <div class="window-content">
                <p></p>
            </div>
        </div>
    </template>

    <script src="index.js"></script>
</body>

</html>
