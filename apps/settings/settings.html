<div class="settings-toolbar" data-toolbar>
  <button class="ui-button icon primary btn-back" title="Atras" data-i18n-title="settings.back">
    <img src="/assets/ui/left-arrow-white.png" alt="Volver atras" data-i18n-alt="settings.backAlt">
  </button>
</div>

<main class="settings-content" id="settingsContent">

</main>

<!-- VISTA PRINCIPAL -->
<template id="tpl-settings-home">
  <h3 data-i18n="settings.title">Ajustes</h3>

  <div class="control-panel-grid">
    <div class="control-item" data-template="tpl-wallpaper">
      <img src="/assets/icons/image.png">
      <span data-i18n="settings.wallpaper">Fondo de pantalla</span>
    </div>

    <div class="control-item" data-template="tpl-window-color">
      <img src="/assets/icons/color.png">
      <span data-i18n="settings.windowColor">Color de ventanas y dock</span>
    </div>

    <div class="control-item" data-template="tpl-language">
      <img src="/assets/icons/language.png">
      <span data-i18n="settings.language">Idioma</span>
    </div>

    <div class="control-item" data-template="tpl-privacy">
      <img src="/assets/icons/privacy.png">
      <span data-i18n="settings.privacy">Privacidad</span>
    </div>

    <div class="control-item" data-template="tpl-location">
      <img src="/assets/icons/location.png">
      <span data-i18n="settings.location">Ubicación</span>
    </div>

    <div class="control-item" onclick="openApp('about', {
      size: { width: 525, height: 'auto' },
      });">
      <img src="/assets/icons/about.png">
      <span data-i18n="settings.about">Acerca de...</span>
    </div>
  </div>
</template>


<!-- TEMPLATES -->
<template id="tpl-wallpaper">
  <h4 data-i18n="settings.wallpaper">Fondo de pantalla</h4>
  <p class="subtitle ui-muted" data-i18n="settings.wallpaperHelp">Haz clic en una imagen para usarla como fondo de
    escritorio.</p>
  <div class="wallpaper-upload-row">
    <label class="ui-button wallpaper-file-button">
      <span data-i18n="settings.chooseWallpaper">Elegir una imagen</span>
      <input type="file" id="wallpaperFileInput" accept="image/*">
    </label>

    <span class="ui-error" id="wallpaperMessage" aria-live="polite"></span>
  </div>

  <div class="wallpaper-grid" id="wallpaperGrid"></div>

</template>

<template id="tpl-window-color">
  <h4 data-i18n="settings.windowColor">Color de ventanas y dock</h4>
  <p class="subtitle ui-muted" data-i18n="settings.windowColorHelp">Haz clic en una imagen para usarla como fondo de
    escritorio.</p>
  <section class="color-section">
    <h5 data-i18n="settings.windowColorSection">Color de ventanas</h5>
    <div class="wallpaper-grid color-grid" id="windowColorGrid"></div>
  </section>

  <section class="color-section">
    <h5 data-i18n="settings.dockColorSection">Color de dock</h5>
    <div class="wallpaper-grid color-grid" id="dockColorGrid"></div>
  </section>
</template>

<template id="tpl-language">
  <h4 data-i18n="settings.language">Idioma</h4>

  <section class="control-panel-grid">
    <div class="control-item" data-language="es">
      <img src="/assets/icons/spain.png">
      <span data-i18n="settings.spanish">Español</span>
    </div>

    <div class="control-item" data-language="en">
      <img src="/assets/icons/english.png">
      <span data-i18n="settings.english">Inglés</span>
    </div>
  </section>
</template>


<template id="tpl-privacy">
  <h4 data-i18n="settings.privacy">Privacidad</h4>
  <section id="settings-privacy-text" data-i18n="settings.privacy.content"></section>
</template>

<template id="tpl-location">

  <!-- <h4 data-i18n="settings.location">Ubicación</h4>
  <p><img height="96" src="/assets/icons/build.png" alt=""> <span data-i18n="settings.underConstruction">En
      construccion</span></p> -->
  <h4 data-i18n="settings.location">
    Ubicación
  </h4>
  <p class="subtitle ui-muted" data-i18n="settings.locationHelp">Busque una ubicación que se establecerá por defecto y
    permitirá acceder a los servicios que la requieran.</p>
  <section class="settings-section">
    <input id="locationSearchInput" class="ui-input" type="text" autocomplete="off"
      data-i18n-placeholder="settings.locationPlaceholder">
    <ul id="locationSearchResults" class="ui-list"></ul>
  </section>
</template>
