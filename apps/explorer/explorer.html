<div class="explorer-toolbar" data-toolbar>

    <!-- Navegación -->
    <button class="ui-button icon" onclick="explorerGoBack(event)" title="Atras" data-i18n-title="explorer.back">
        <img src="/assets/ui/left-arrow.png" alt="Flecha izquierda" title="Atras" data-i18n-alt="explorer.backAlt" data-i18n-title="explorer.back">
    </button>
    <button class="ui-button icon" onclick="explorerGoForward(event)" title="Siguiente" data-i18n-title="explorer.forward">
        <img src="/assets/ui/right-arrow.png" alt="Flecha derecha" title="Siguiente" data-i18n-alt="explorer.forwardAlt" data-i18n-title="explorer.forward">
    </button>

    <!-- Dirección / breadcrumb -->
    <div class="explorer-path" id="pathBar">
    </div>

    <button class="ui-button icon" onclick="explorerGoToPath(event)" title="Recargar vista" data-i18n-title="explorer.reload">
        <img src="/assets/ui/enter.png" alt="Flechas apuntandose una a otra" title="Recargar vista" data-i18n-alt="explorer.reloadAlt" data-i18n-title="explorer.reload">
    </button>

    <div class="toolbar-separator"></div>

    <!-- Toggle vista -->
    <button id="toggle-view" class="ui-button icon" title="Cambiar vista" onclick="explorerSwitchView(event)" data-i18n-title="explorer.changeView">
        <img src="/assets/ui/list.png" alt="Cambiar vista" title="Cambiar vista" data-i18n-alt="explorer.changeView" data-i18n-title="explorer.changeView">
    </button>
</div>

<div class="explorer-container">
    <div id="explorer"></div>
</div>
